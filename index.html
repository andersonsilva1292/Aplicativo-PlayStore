    <script>
      if ('serviceWorker' in navigator) {
        const origRegister = navigator.serviceWorker.register.bind(navigator.serviceWorker);
        navigator.serviceWorker.register = function(scriptURL, options) {
          if (typeof scriptURL === 'string' && scriptURL.indexOf('_service-worker.js') !== -1) {
            return origRegister('/sw.js', { scope: '/' });
          }
          return origRegister(scriptURL, options);
        };
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(async function(reg) {
              if ('sync' in reg) {
                try { await reg.sync.register('sync-practice-progress'); } catch (e) {}
              }
              if ('periodicSync' in reg) {
                try {
                  const status = await navigator.permissions?.query({ name: 'periodic-background-sync' });
                  if (status && status.state === 'granted') {
                    await reg.periodicSync.register('daily-simulado-reminder', { minInterval: 24 * 60 * 60 * 1000 });
                  }
                } catch (e) {}
              }
            })
            .catch(function(err) {
              console.warn('ServiceWorker registration error:', err);
            });
        });
      }
    </script>
